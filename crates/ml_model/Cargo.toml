[package]
name = "ml_model"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
getrandom.workspace = true
feature_extractor.workspace = true
replay_structs.workspace = true

anyhow.workspace = true
burn.workspace = true
serde_json.workspace = true
tracing.workspace = true

# The GPU backend, for every non-WASM target (training + server inference), so
# `FusedLstm` can register its single-op BPTT backward pass on the CubeCL
# backend as well as on Flex. The WASM build gets only the Flex CPU backend,
# which is already in the workspace `burn` dep.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
burn = { workspace = true, features = ["wgpu"] }

[features]
default = []
